services:
  postgres:
    image: postgres:18.3-alpine
    hostname: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    expose:
      - 5432
    ports:
      - '55432:5432'
    volumes:
      - ./postgres18-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - default

  minio:
    image: minio/minio:latest-cicd
    restart: unless-stopped
    hostname: minio
    expose:
      - 9009
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: minio server --address :9009 /bitnami/minio/data
    volumes:
      - ./minio-data:/bitnami/minio/data
    networks:
      - default

  webapp:
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
      plugin-runner:
        condition: service_healthy
    build:
      context: '.'
      target: webapp
    restart: unless-stopped
    user: "10001:10000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    links:
      - postgres:postgres
      - minio:minio
    ports:
      - '56481:8080'
      - '5705:5705'
    expose:
      - 8080
      - 8081
    labels:
      promtail: "true"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MINIO_URL=http://minio:9009
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - ALLOWED_ORIGIN=http://172.22.0.20:56481
      - MINIO_DEFAULT_BUCKET=main
      - INSTANCE_NAME=${INSTANCE_NAME}
      - LLM_URL=${LLM_URL}
      - JEV_ENABLED=${JEV_ENABLED:-true}
      - JEV_API_KEY=${JEV_API_KEY:-}
      - PLUGINS_DIR=/home/java/plugins
      - ULDESK_PLUGINS_RUNNER_SOCKET=/run/uldesk-ipc/plugin-runner.sock
      - ULDESK_PLUGINS_BROKER_SOCKET=/run/uldesk-ipc/plugin-broker.sock
      - LOG_PATH=/home/java/logs
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=uldesk_global_search
      - REDIS_HOST=redis
      - ULDESK_PLUGIN_SECRET_KEY=${ULDESK_PLUGIN_SECRET_KEY}
      - PUBLIC_URL=${PUBLIC_URL}
    volumes:
      - ./webapp-logs:/home/java/logs
      - ./plugins:/home/java/plugins
      - plugin-ipc:/run/uldesk-ipc
    networks:
      - default
      - monitoring

  plugin-ipc-init:
    build:
      context: .
      target: webapp
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - plugin-ipc:/run/uldesk-ipc
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown 0:10000 /run/uldesk-ipc
        chmod 1770 /run/uldesk-ipc
    restart: "no"

  plugin-runner:
    build:
      context: '.'
      target: plugin-runner
    restart: unless-stopped
    depends_on:
      plugin-ipc-init:
        condition: service_completed_successfully
    user: "10002:10000"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/plugin-runner-seccomp.json
      - apparmor=uldesk-plugin-runner
    pids_limit: 128
    mem_limit: 1536m
    environment:
      - ULDESK_PLUGIN_RUNNER_SOCKET=/run/uldesk-ipc/plugin-runner.sock
      - ULDESK_PLUGIN_BROKER_SOCKET=/run/uldesk-ipc/plugin-broker.sock
      - ULDESK_PLUGINS_DIR=/home/java/plugins
      - ULDESK_APP_DIR=/home/java/app
      - ULDESK_BWRAP=/usr/bin/bwrap
      - ULDESK_PLUGIN_RUNNER_MAX_CONCURRENT=2
    volumes:
      - ./plugins:/home/java/plugins:ro
      - plugin-ipc:/run/uldesk-ipc
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    healthcheck:
      test: ["CMD", "java", "-cp", "/home/java/app/BOOT-INF/classes:/home/java/app/BOOT-INF/lib/*", "ru.ravel.ItDesk.plugins.PluginRunnerMain", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  grafana:
    build: './config/grafana'
    restart: unless-stopped
    ports:
      - '3000:3000'
    expose:
      - 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-data:/prometheus
    expose:
      - 9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--log.level=debug'
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - ./config/promtail/config.yaml:/etc/promtail/config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./webapp-logs:/webapp-logs:ro
    command: -config.file=/etc/promtail/config.yaml
    expose:
      - 9080
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command:
      - '-config.file=/etc/loki/config.yaml'
    volumes:
      - ./config/loki/config.yaml:/etc/loki/config.yaml:ro
      - ./loki-index:/data/index
      - ./loki-chunks:/data/chunks
      - ./loki-cache:/data/cache
      - ./loki-compactor:/data/compactor
      - ./loki-wal:/loki/wal
    expose:
      - 3100
      - 9095
    depends_on:
      - promtail
    user: root
    networks:
      - monitoring

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    expose:
      - 9200
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: bitnami/redis
    restart: unless-stopped
    hostname: redis
    expose:
      - 6379
    environment:
      - REDIS_PASSWORD=supersecret
    networks:
      - default

volumes:
  plugin-ipc:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450
  monitoring:
    driver: bridge
    name: itdesk_monitoring
    external: false
